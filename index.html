<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />

  <!-- Discord Embed -->
  <meta property="og:site_name" content="Confoederatio">
  <meta name="theme-color" content="#2f45bf">

  <meta property="og:title" content="Confoederatio Dataview">
  <meta property="og:description" content="All Confoederatio datasets from 10000BC to Now. The world at 5-arcmin.">
  <meta property="og:image" content="https://i.postimg.cc/QN7pZS8R/80-dataview-composite.png">
  <meta property="og:url" content="https://dataview.confoederatio.org">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/gfx/interface/logos/confoederatio_icon_32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/gfx/interface/logos/confoederatio_icon_16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/gfx/interface/logos/confoederatio_icon_128x128.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Confoederatio Dataview</title>

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Karla, Fira Code, and Material Icons -->
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Karla:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,700&family=Material+Icons&family=Material+Icons+Sharp&display=swap"
    rel="stylesheet">
  <script>
    (function () {
      function updateAppHeight() {
        var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
        document.documentElement.style.setProperty('--app-height', h + 'px');
      }
      updateAppHeight();
      window.addEventListener('resize', updateAppHeight);
      window.addEventListener('orientationchange', updateAppHeight);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateAppHeight);
        window.visualViewport.addEventListener('scroll', updateAppHeight);
      }
      if (typeof console !== 'undefined') {
        var noop = function () { };
        if (typeof console.timeStamp === 'function') {
          var nativeStamp = console.timeStamp.bind(console);
          console.timeStamp = function () {
            try { nativeStamp.apply(console, arguments); } catch (e) { }
          };
        } else {
          console.timeStamp = noop;
        }
      }
    })();
  </script>
  <!-- Critical CSS for full-viewport loading screen without default margins -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: var(--app-height, 100dvh);
      max-height: var(--app-height, 100dvh);
      overflow: hidden;
      background-color: #09090b;
    }

    #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: var(--app-height, 100dvh);
      max-height: var(--app-height, 100dvh);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body style="margin: 0; padding: 0; background-color: #09090b; overflow: hidden;">
  <div id="root">
    <div
      style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; background: #09090b; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; z-index: 9999;">
      <div
        style="width: 38px; height: 38px; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: rgb(200, 40, 40); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;">
      </div>
      <div style="font-size: 14px; font-weight: 500; letter-spacing: 0.05em; color: #94a3b8;">Loading Dataview...</div>
    </div>
  </div>
  <script type="module" src="/core/main.tsx"></script>
</body>

</html>
