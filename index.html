<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoPNG Raster Data Viewer | deck.gl + ECharts</title>
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Karla, Fira Code, and Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Karla:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,700&family=Material+Icons&family=Material+Icons+Sharp&display=swap" rel="stylesheet">
    <!-- Critical CSS for full-viewport loading screen without default margins -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0f19;
      }
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #0b0f19; overflow: hidden;">
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; background: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; z-index: 9999;">
        <div style="width: 38px; height: 38px; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 14px; font-weight: 500; letter-spacing: 0.05em; color: #94a3b8;">Loading Dataview...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
